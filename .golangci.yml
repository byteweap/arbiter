version: "2"
run:
  go: "1.23"
linters:
  enable:
    - exhaustive
    - gocognit
    - gocyclo
    - misspell
    - prealloc
    - thelper
    - whitespace
  settings:
    govet:
      disable:
        - inline
    exhaustive:
      default-signifies-exhaustive: true
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 50
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/byteweap/arbiter
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
